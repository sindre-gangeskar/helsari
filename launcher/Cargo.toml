[package]
name = "helsari-launcher"
version = "0.1.0"
edition = "2021"
description = "Helsari launcher: finds the player's game dump, builds the port from it, and starts it"
publish = false

[[bin]]
name = "helsari-launcher"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"   # native folder and file pickers

[profile.release]
strip = true
lto = true
